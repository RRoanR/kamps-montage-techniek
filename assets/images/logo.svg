<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="100%" stop-color="#E25822" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark (Icon) -->
  <g transform="translate(10, 10)">
    <!-- Stylized Roof Structure / Geometric Shape -->
    <!-- The Flat Roof Line (Bitumen Focus) -->
    <path d="M 15,45 L 85,45" stroke="#E25822" stroke-width="6" stroke-linecap="round" />
    
    <!-- Isometric/Stylized Building Structure -->
    <path d="M 20,45 L 20,80 L 50,95 L 80,80 L 80,45" fill="none" stroke="url(#slateGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 50,45 L 50,95" fill="none" stroke="url(#slateGrad)" stroke-width="3" stroke-dasharray="2 3" />

    <!-- Stylized K/M Arrow (representing Montage & Roof slope/layers) -->
    <path d="M 35,45 L 50,30 L 65,45 L 50,60 Z" fill="url(#orangeGrad)" filter="url(#dropShadow)" />
    
    <!-- Accent detail -->
    <circle cx="50" cy="45" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(115, 0)">
    <!-- Main brand name "KAMPS" -->
    <text x="0" y="58" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="#0F172A" letter-spacing="1">KAMPS</text>
    
    <!-- Subtitle "MONTAGE TECHNIEK" -->
    <text x="2" y="88" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#E25822" letter-spacing="4.5">MONTAGE TECHNIEK</text>
    
    <!-- Small subtle divider line -->
    <line x1="2" y1="67" x2="300" y2="67" stroke="#E2E8F0" stroke-width="2" />
  </g>
</svg>
